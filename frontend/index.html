    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        dark: {
                            bg: '#09090b',
                            surface: '#18181b',
                            border: '#27272a'

    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap"
        rel="stylesheet">
    <style>
        body {
            font-family: 'Plus Jakarta Sans', sans-serif;
        }

        .custom-scrollbar::-webkit-scrollbar {
            width: 4px;
        }

        .custom-scrollbar::-webkit-scrollbar-thumb {
            background: #e5e7eb;
            border-radius: 10px;
        }

        .dark .custom-scrollbar::-webkit-scrollbar-thumb {
            background: #3f3f46;
        }

        /* Mobile Drawer Transition */
        .drawer-transition {
            transition: transform 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        }

        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: translateY(10px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .animate-fade-in {
            animation: fadeIn 0.4s ease-out forwards;
        }

        .typing-dot {
            animation: typingBounce 1.4s infinite ease-in-out both;
        }

        .typing-dot:nth-child(1) {
            animation-delay: -0.32s;
        }

        .typing-dot:nth-child(2) {
            animation-delay: -0.16s;
        }

        @keyframes typingBounce {

            0%,
            80%,
            100% {
                transform: scale(0);
            }

            40% {
                transform: scale(1);
            }
        }
    </style>
</head>

    <script>
        const chatWindow = document.getElementById('chat-window');
        const chatInput = document.getElementById('chat-input');
        const sendButton = document.getElementById('send-button');
        const welcomeScreen = document.getElementById('welcome-screen');
        const themeBtn = document.getElementById('theme-toggle');

        // Mobile Sidebar Elements
        const mobileSidebar = document.getElementById('mobile-sidebar');
        const mobileOverlay = document.getElementById('mobile-overlay');
        const mobileHistoryList = document.getElementById('mobile-history-list');
        const desktopHistoryList = document.getElementById('desktop-history-list');

        // --- MOBILE MENU TOGGLE LOGIC ---
        function toggleMobileMenu() {
            const isClosed = mobileSidebar.classList.contains('translate-x-full');

            if (isClosed) {
                // Open
                mobileSidebar.classList.remove('translate-x-full');
                mobileOverlay.classList.remove('hidden');
                // Small delay to allow 'hidden' removal to register before opacity transition
                setTimeout(() => mobileOverlay.classList.remove('opacity-0'), 10);
            } else {
                // Close
                mobileSidebar.classList.add('translate-x-full');
                mobileOverlay.classList.add('opacity-0');
                setTimeout(() => mobileOverlay.classList.add('hidden'), 300);
            }
        }

        // --- DARK MODE LOGIC ---
        if (localStorage.theme === 'dark' || (!('theme' in localStorage) && window.matchMedia('(prefers-color-scheme: dark)').matches)) {
            document.documentElement.classList.add('dark');
        } else {
            document.documentElement.classList.remove('dark');
        }

        themeBtn.addEventListener('click', () => {
            document.documentElement.classList.toggle('dark');
            localStorage.theme = document.documentElement.classList.contains('dark') ? 'dark' : 'light';
        });

        // --- FETCH HISTORY LOGIC (Populates BOTH Desktop & Mobile) ---
        async function fetchHistory() {
            // Helper to generate HTML
            const generateList = (questions) => {
                if (questions.length === 0) {
                    return `
                    <div class="flex flex-col items-center justify-center h-32 text-gray-400 dark:text-gray-600">
                        <p class="text-xs">No questions yet</p>
                    </div>`;
                }
                return questions.map(q => `
                    <div onclick="handleQuickAsk('${(q.question || "").replace(/'/g, "\\'")}')" 
                         class="p-4 bg-white dark:bg-dark-surface border border-gray-100 dark:border-dark-border rounded-xl hover:border-orange-400 dark:hover:border-orange-500 shadow-sm cursor-pointer transition group relative overflow-hidden">
                        <div class="absolute top-0 left-0 w-1 h-full bg-orange-500 opacity-0 group-hover:opacity-100 transition-opacity"></div>
                        <h4 class="text-xs md:text-sm font-medium text-gray-700 dark:text-gray-300 group-hover:text-orange-600 dark:group-hover:text-orange-400 transition-colors line-clamp-2">
                            ${q.question}
                        </h4>
                        <span class="text-[10px] text-gray-400 mt-1 block">
                            ${new Date(q.timestamp).toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' })}
                        </span>
                    </div>
                `).join('');
            };

            try {
                const res = await fetch('https://smartfolio-5jf7.onrender.com/get_questions_history', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({})
                });
                const result = await res.json();
                const questions = result.data || [];

                // Render to both containers
                const html = generateList(questions);
                if (desktopHistoryList) desktopHistoryList.innerHTML = html;
                if (mobileHistoryList) mobileHistoryList.innerHTML = html;

            } catch (error) {
                console.error("History fetch failed", error);
                const errHtml = `<div class="text-center text-xs text-red-400 mt-4">Failed to load history</div>`;
                if (desktopHistoryList) desktopHistoryList.innerHTML = errHtml;
                if (mobileHistoryList) mobileHistoryList.innerHTML = errHtml;
            }
        }

        // --- QUICK ASK HANDLER ---
        function handleQuickAsk(question) {
            // Close mobile menu if open
            if (!mobileSidebar.classList.contains('translate-x-full')) {
                toggleMobileMenu();
            }
            chatInput.value = question;
            sendMessage();
        }

        // --- COMPONENT RENDERERS ---
        const uiRenderers = {
            TIMELINE: (data) => `
            <div class="mt-4 md:mt-6 space-y-0 relative border-l-2 border-gray-100 dark:border-dark-border ml-2 md:ml-3">
                ${data.events.map(ev => `
                    <div class="ml-4 md:ml-6 mb-6 md:mb-8 relative">
                        <span class="absolute -left-[23px] md:-left-[31px] top-1 w-3 h-3 md:w-4 md:h-4 rounded-full bg-white dark:bg-dark-surface border-4 border-orange-500"></span>
                        <div class="bg-gray-50 dark:bg-dark-surface p-3 md:p-4 rounded-xl border border-gray-100 dark:border-dark-border">
                            <span class="text-[10px] md:text-xs font-bold text-orange-500 uppercase tracking-wider mb-1 block">${ev.year}</span>
                            <h5 class="text-sm font-bold text-gray-800 dark:text-gray-100">${ev.title}</h5>
                            <p class="text-xs text-gray-500 dark:text-gray-400 mt-1">${ev.desc || ''}</p>
                        </div>
                    </div>
                `).join('')}
            </div>`,

            SKILLCARD: (data) => `
            <div class="mt-4 md:mt-6 grid grid-cols-2 gap-2 md:gap-3">
                ${data.skills.map(s => `
                    <div class="p-2 md:p-3 bg-white dark:bg-dark-surface border border-gray-100 dark:border-dark-border rounded-xl shadow-sm flex items-center gap-2">
                        <div class="w-1.5 h-1.5 md:w-2 md:h-2 rounded-full bg-orange-500"></div>
                        <span class="text-xs font-bold text-gray-700 dark:text-gray-300">${s}</span>
                    </div>
                `).join('')}
            </div>`,

            // UPDATED PROJECTCARD RENDERER TO HANDLE ARRAYS
            PROJECTCARD: (data) => {
                // Check if data is an array, if not wrap it
                const projects = Array.isArray(data) ? data : [data];

                return `
                <div class="mt-4 md:mt-6 space-y-4">
                    ${projects.map(project => `
                    <div class="border border-gray-100 dark:border-dark-border bg-white dark:bg-dark-surface p-4 md:p-5 rounded-2xl shadow-sm hover:shadow-md transition-shadow">
                        <div class="flex justify-between items-start">
                            <div>
                                <div class="flex items-center gap-2 mb-2">
                                    <span class="px-2 py-0.5 bg-orange-100 dark:bg-orange-900/30 text-orange-600 dark:text-orange-400 rounded text-[10px] font-bold uppercase">Featured</span>
                                    <h4 class="font-bold text-gray-800 dark:text-gray-100 text-base md:text-lg">${project.name}</h4>
                                </div>
                                <p class="text-xs md:text-sm text-gray-500 dark:text-gray-400 leading-relaxed mb-4">${project.description}</p>
                            </div>
                            <div class="bg-gray-50 dark:bg-zinc-800 p-2 rounded-lg text-xl">🚀</div>
                        </div>
                        ${project.url ? `
                        <a href="${project.url}" target="_blank" class="inline-flex items-center gap-2 text-xs font-bold text-white bg-black dark:bg-white dark:text-black px-4 py-2 rounded-lg hover:bg-gray-800 dark:hover:bg-gray-200 transition">
                            View Project 
                            <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3"><path d="M5 12h14M12 5l7 7-7 7"/></svg>
                        </a>` : ''}
                    </div>
                    `).join('')}
                </div>`;
            },

            NONE: () => ``
        };

        // --- MAIN SEND FUNCTION ---
        async function sendMessage() {
            const text = chatInput.value.trim();
            if (!text) return;

            if (welcomeScreen) welcomeScreen.style.display = 'none';
            chatWindow.classList.remove('items-center', 'justify-center');

            // User Bubble
            const userDiv = document.createElement('div');
            userDiv.className = "flex justify-end mb-6 animate-fade-in";
            userDiv.innerHTML = `
            <div class="bg-black dark:bg-white text-white dark:text-black px-4 py-2 md:px-5 md:py-3 rounded-2xl rounded-tr-sm max-w-[85%] md:max-w-lg shadow-lg text-sm leading-relaxed font-medium">
                ${text}
            </div>
        `;
            chatWindow.appendChild(userDiv);
            chatWindow.scrollTop = chatWindow.scrollHeight;
            chatInput.value = '';

            // Loader
            const loaderDiv = document.createElement('div');
            loaderDiv.className = "flex flex-col mb-8 animate-fade-in";
            loaderDiv.id = "api-loader";
            loaderDiv.innerHTML = `
            <div class="flex gap-3 md:gap-4 max-w-2xl">
                <div class="w-8 h-8 rounded-full bg-orange-100 dark:bg-orange-900/30 flex-shrink-0 flex items-center justify-center text-lg">🤖</div>
                <div class="bg-white dark:bg-dark-surface border border-gray-200 dark:border-dark-border px-4 py-3 rounded-3xl rounded-tl-sm shadow-sm flex items-center gap-1">
                    <div class="w-1.5 h-1.5 bg-gray-400 dark:bg-gray-500 rounded-full typing-dot"></div>
                    <div class="w-1.5 h-1.5 bg-gray-400 dark:bg-gray-500 rounded-full typing-dot"></div>
                    <div class="w-1.5 h-1.5 bg-gray-400 dark:bg-gray-500 rounded-full typing-dot"></div>
                </div>
            </div>
        `;
            chatWindow.appendChild(loaderDiv);
            chatWindow.scrollTop = chatWindow.scrollHeight;

            try {
                const response = await fetch('https://smartfolio-5jf7.onrender.com/ask', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json', 'accept': 'application/json' },
                    body: JSON.stringify({ "user_question": text })
                });

                if (!response.ok) throw new Error('Network error');
                const data = await response.json();

                fetchHistory();

                const loader = document.getElementById("api-loader");
                if (loader) loader.remove();

                const botOutput = data.output;
                const componentType = botOutput.has_ui_render_component;
                const componentData = botOutput.ui_component;

                let componentHtml = '';
                if (componentType !== "NONE" && uiRenderers[componentType] && componentData) {
                    componentHtml = uiRenderers[componentType](componentData);
                }

                const botDiv = document.createElement('div');
                botDiv.className = "flex flex-col mb-8 animate-fade-in";
                botDiv.innerHTML = `
                <div class="flex gap-3 md:gap-4 max-w-2xl w-full">
                    <div class="w-8 h-8 rounded-full bg-orange-100 dark:bg-orange-900/30 flex-shrink-0 flex items-center justify-center text-lg">🤖</div>
                    <div class="bg-white dark:bg-dark-surface border border-gray-200 dark:border-dark-border p-4 md:p-6 rounded-3xl rounded-tl-sm shadow-sm w-full min-w-0">
                        <p class="text-sm leading-relaxed text-gray-700 dark:text-gray-200 font-medium mb-2">${botOutput.text_content}</p>
                        ${componentHtml}
                    </div>
                </div>
            `;

                chatWindow.appendChild(botDiv);
                chatWindow.scrollTop = chatWindow.scrollHeight;

            } catch (error) {
                console.error('Error:', error);
                const loader = document.getElementById("api-loader");
                if (loader) loader.remove();

                // Error Msg
                const errorDiv = document.createElement('div');
                errorDiv.className = "flex gap-3 max-w-2xl";
                errorDiv.innerHTML = `
                     <div class="w-8 h-8 rounded-full bg-red-100 text-lg flex items-center justify-center">⚠️</div>
                     <div class="bg-red-50 p-4 rounded-3xl text-red-600 text-sm border border-red-100">Connection Failed</div>
                `;
                chatWindow.appendChild(errorDiv);
            }
        }

        sendButton.addEventListener('click', sendMessage);
        chatInput.addEventListener('keypress', (e) => e.key === 'Enter' && sendMessage());

        // Initial Fetch
        fetchHistory();
    </script>

</body>

</html>
